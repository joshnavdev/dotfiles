# Kanagawa Wave for tmux (status line). Colors from themes/kanagawa/upstream (kanagawa.nvim)
set -g mode-style "fg=#16161d,bg=#c8c093"
set -g message-style "fg=#16161d,bg=#c8c093"
set -g message-command-style "fg=#16161d,bg=#c8c093"
set -g pane-border-style "fg=#c8c093"
set -g pane-active-border-style "fg=#7e9cd8"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#c8c093,bg=#16161d"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#16161d,bg=#7e9cd8,bold] #S #[fg=#7e9cd8,bg=#16161d,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#16161d,bg=#16161d,nobold,nounderscore,noitalics]#[fg=#7e9cd8,bg=#16161d] #{prefix_highlight} #[fg=#c8c093,bg=#16161d,nobold,nounderscore,noitalics]#[fg=#16161d,bg=#c8c093] %Y-%m-%d  %I:%M %p #[fg=#7e9cd8,bg=#c8c093,nobold,nounderscore,noitalics]#[fg=#16161d,bg=#7e9cd8,bold] #h "
setw -g window-status-activity-style "underscore,fg=#727169,bg=#16161d"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#727169,bg=#16161d"
setw -g window-status-format "#[fg=#16161d,bg=#16161d,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#16161d,bg=#16161d,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#16161d,bg=#c8c093,nobold,nounderscore,noitalics]#[fg=#16161d,bg=#c8c093,bold] #I  #W #F #[fg=#c8c093,bg=#16161d,nobold,nounderscore,noitalics]"

set -g status-position top
